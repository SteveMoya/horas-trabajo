<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <ellipse cx="100" cy="158" rx="60" ry="8" fill="{{surfaceLow}}"/>

  <!-- Libro cerrado -->
  <rect x="66" y="132" width="68" height="16" rx="4" fill="{{coffeeLight}}"/>

  <!-- Taza con check en el vapor -->
  <g id="success-cup">
    <path d="M80 96 h40 v28 a20 20 0 0 1-40 0 Z" fill="{{primaryContainer}}"/>
    <path d="M120 100 c10 -2 10 16 0 16" stroke="{{primaryContainer}}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M90 108 l8 8 l14 -16" stroke="{{onPrimaryContainer}}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="success-steam" stroke="{{coffee}}" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M86 88 c-4 -6 4 -8 0 -14"/>
    <path d="M114 88 c-4 -6 4 -8 0 -14"/>
  </g>

  <!-- Confeti sutil -->
  <g id="success-confetti" fill="{{tertiary}}" opacity="0.8">
    <circle cx="50" cy="80" r="4"/>
    <circle cx="150" cy="70" r="5"/>
    <circle cx="158" cy="110" r="3"/>
    <circle cx="42" cy="118" r="3"/>
  </g>
</svg>
