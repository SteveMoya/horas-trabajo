name: Build Flutter APK + Release

# Se dispara al crear/empujar una etiqueta v* (release) o manualmente (beta).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK firmado
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      # Configuración de firma desde secrets (andá al README).
      - name: Preparar keystore y key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 no configurado."
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_ALIAS_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Determinar etiqueta de release
        id: tag
        run: |
          if [ -n "${{ github.ref_type }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=beta" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear/actualizar Release Beta con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NAME="horas-trabajo-${VERSION}.apk"
          cp "$APK" "$NAME"

          if [ -n "${{ steps.tag.outputs.create_tag }}" ]; then
            # beta manual: asegurar etiqueta apuntando al último commit
            git tag -f "$VERSION" "${{ github.sha }}"
            git push origin "$VERSION" --force >/dev/null 2>&1 || true
          fi

          # Eliminar release previo del mismo nombre si existe (beta reusada)
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$VERSION" \
            "$NAME" \
            --title "Beta ${VERSION} — Horas Trabajo RD" \
            --notes "$(cat .github/RELEASE_NOTES.md 2>/dev/null || echo 'Release automática del APK.')" \
            --prerelease