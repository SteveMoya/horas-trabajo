name: horas_trabajo
description: "Registro de Horas Trabajadas — app local con cálculo salarial según Código de Trabajo RD (Ley 16-92). Material 3, 100% local."
publish_to: "none"
version: 0.7.3+22

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Manejo de estado (liviano)
  provider: ^6.1.2

  # Almacenamiento local
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Ubicación / GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Notificaciones locales + vigilancia geocerca en segundo plano
  flutter_local_notifications: ^17.2.4
  flutter_background_service: ^5.0.10
  timezone: ^0.9.4

  # Formato de fechas, horas y moneda (es / RD$)
  intl: ^0.19.0

  # Tipografía pulida (opcional)
  google_fonts: ^6.2.1
  csv: ^8.0.0
  pdf: ^3.13.0
  share_plus: ^13.3.0
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  home_widget: ^0.9.3
  quick_actions: ^1.1.0
  speech_to_text: ^7.4.0

  # Revisión y actualización automática desde los releases de GitHub
  http: ^1.2.2
  package_info_plus: ^10.2.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png