name: horas_trabajo
description: "Registro de Horas Trabajadas — app local con cálculo salarial según Código de Trabajo RD (Ley 16-92). Material 3, 100% local."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Manejo de estado (liviano)
  provider: ^6.1.2

  # Almacenamiento local
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Ubicación / GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Formato de fechas, horas y moneda (es / RD$)
  intl: ^0.19.0

  # Tipografía pulida (opcional)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true